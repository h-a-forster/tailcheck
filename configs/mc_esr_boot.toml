# Bootstrap ESR tests: size and power (DESIGN section 6.1).
# `warp` cells use the warp-speed method (one bootstrap resample per replication; Giacomini,
# Politis and White 2013); the `exact` cell runs the full bootstrap test with n_boot
# resamples per replication as a cross-check. Every cell also records the asymptotic
# p-value of the same replications.
# Calibrated 2026-10-23 (configs/mc_esr_boot_calib.toml): about 2.7 s per warp replication
# (v1 + v3) at n = 1000, 5.8 s at n = 2000, and 0.33 s per bootstrap fit; this profile is
# about 11,000 CPU-seconds (about 70 minutes of wall time on 3 workers).
# Full size (same cells, reps x 5, exact n_boot = 499; about 15 CPU-hours): copy this file,
# change the reps, n_boot, name and out_dir, then run it the same way.
name = "mc-esr-boot"
seed = 20261024
level = 0.05

[[cells]]
mode = "warp"
dgp = "garch-t5"
n = 1000
alpha = 0.025
versions = [1, 3]
reps = 1000

[[cells]]
mode = "warp"
dgp = "garch-t5"
n = 2000
alpha = 0.025
versions = [1, 3]
reps = 400

[[cells]]
mode = "warp"
dgp = "scale-0.85"
n = 1000
alpha = 0.025
versions = [1, 3]
reps = 400

[[cells]]
mode = "warp"
dgp = "normal-tails"
n = 1000
alpha = 0.025
versions = [1, 3]
reps = 400

[[cells]]
mode = "exact"
dgp = "garch-t5"
n = 1000
alpha = 0.025
versions = [3]
n_boot = 99
reps = 120

[run]
workers = 3
chunk = 10
out_dir = "runs/mc-esr-boot"
