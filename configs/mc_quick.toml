# Monte Carlo size/power validation, default ("quick") profile. See docs/DESIGN.md section 6.
# Budget target was 45 CPU-minutes; the calibrated run needs about 124 (see
# results/mc-quick/calibration.json). M8 starts with a
# timing calibration; if the projection exceeds the budget, lower reps_power first and never
# take reps_size below 200 for any ESR cell. The run records the reps it actually used.
name = "mc-quick"
seed = 20261023
level = 0.05
chunk = 50                          # replications per checkpointed unit

[cheap]                             # VaR tests, Acerbi-Szekely, McNeil-Frey
tests = ["kupiec", "christoffersen_ind", "christoffersen_cc", "dq", "as_z1", "as_z2", "mcneil_frey"]
n = [250, 1000, 2000]
alphas = [0.01, 0.025]
dgps_size = ["iid-t5", "garch-t5"]
dgps_power = ["scale-0.85", "normal-tails", "slow-vol"]
reps_size = 2000
reps_power = 1000
as_n_sim = 2000
mcneil_frey_boot = 999

[esr]                               # Bayer-Dimitriadis ESR tests (about 1 s per fit)
versions = [1, 3]
n = [1000, 2000]
alphas = [0.025]
extra_cells = [{ version = 1, n = 2000, alpha = 0.01 }, { version = 3, n = 2000, alpha = 0.01 }]
dgps_size = ["garch-t5"]
dgps_power = ["scale-0.85", "normal-tails"]
reps_size = 200                     # calibrated 2026-10-23: see results/mc-quick/calibration.json
reps_power = 40
chunk = 10
bootstrap = 0

[run]
workers = 4
out_dir = "runs/mc-quick"
