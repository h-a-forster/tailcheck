# Monte Carlo size/power validation, full-size profile. Projected (not run) at roughly 35-45
# CPU-hours (9-12 hours wall with 4 workers): 2,900 ESR replications per (n, alpha) with
# three versions take about 2.0, 2.3, 3.8 and 12.6 s per replication at n = 500, 1000, 2000
# and 5000 (about 33 CPU-hours), plus about 5-8 CPU-hours for the other tests and the
# per-chunk Acerbi-Szekely null samples. Resumable: completed chunks are skipped on rerun.
# The bootstrap ESR size study has its own runner (configs/mc_esr_boot.toml, DESIGN 6.1).
# Re-timed 2026-10-24 (scripts/retime_full.py, results/retime-full.json) on a loaded shared
# machine: 145 CPU-hours as measured (ESR 133: 4.9, 7.6-7.9, 13.6-15.7 and 47-63 s per
# replication at n = 500, 1000, 2000, 5000); a reference fit ran 1.4-2.6 times slower than
# on a quieter machine, so roughly 55-105 CPU-hours idle. The projection above is too low.
name = "mc-full"
seed = 20261023
level = 0.05
chunk = 50

[cheap]
tests = ["kupiec", "christoffersen_ind", "christoffersen_cc", "dq", "as_z1", "as_z2", "mcneil_frey"]
n = [250, 500, 1000, 2000, 5000]
alphas = [0.01, 0.025, 0.05]
dgps_size = ["iid-t5", "garch-t5", "iid-normal"]
dgps_power = ["scale-0.85", "scale-0.70", "normal-tails", "unconditional"]
reps_size = 10000
reps_power = 2000
as_n_sim = 5000
mcneil_frey_boot = 1999

[esr]
versions = [1, 2, 3]
n = [500, 1000, 2000, 5000]
alphas = [0.01, 0.025]
extra_cells = []
dgps_size = ["garch-t5", "iid-t5"]
dgps_power = ["scale-0.85", "normal-tails", "unconditional"]
reps_size = 1000
reps_power = 300

[run]
workers = 4
out_dir = "runs/mc-full"
